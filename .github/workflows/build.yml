name: Build & Release (macOS + Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-gui.txt pytest

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/admin_gui -q

      - name: Build .app + sign + .dmg + notarize
        env:
          # 未設定 → codesign_app.sh 退回 ad-hoc、notarize_dmg.sh 略過（建置仍成功）
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: bash scripts/build_gui.sh

      - name: Verify signature / Gatekeeper
        run: |
          codesign -dv --verbose=2 dist/TradingAdmin.app 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true
          # 檢查 DMG 裡的 App（DMG 外殼本身不簽，Gatekeeper 看的是 App + staple 的公證票）
          M=$(hdiutil attach -nobrowse -readonly dist/TradingAdmin-macOS.dmg | awk -F'\t' '/Volumes/{print $NF}')
          spctl -a -t exec -vv "$M/TradingAdmin.app" 2>&1 || echo "（未公證：Gatekeeper 不接受，首次需右鍵→開啟）"
          hdiutil detach -quiet "$M"

      - name: Upload DMG as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradingAdmin-macOS
          path: dist/TradingAdmin-macOS.dmg
          if-no-files-found: error

      - name: Attach DMG to Release (on tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TradingAdmin-macOS.dmg
          generate_release_notes: true

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-gui.txt pytest

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: python -m pytest tests/admin_gui -q

      - name: Build TradingAdmin (onedir)
        shell: pwsh
        run: |
          python -m PyInstaller admin_gui/admin_gui.spec --noconfirm --clean
          if (-not (Test-Path dist/TradingAdmin/TradingAdmin.exe)) { throw "TradingAdmin.exe not built" }

      # 安裝程式做法沿用 TopRacer-console：Inno Setup → Setup.exe（不簽章，同 TopRacer）
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Package Setup.exe
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ($ver -notmatch '^\d+\.\d+\.\d+') { $ver = "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" packaging\tradingadmin.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item installer/TradingAdmin-Windows-Setup.exe | Format-List Name,Length

      - name: Smoke test (silent install → launch → uninstall)
        shell: pwsh
        run: |
          $p = Start-Process installer/TradingAdmin-Windows-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\TradingAdmin\TradingAdmin.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "TradingAdmin.exe exited early (code $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 2
          $un = Join-Path $env:LOCALAPPDATA "Programs\TradingAdmin\unins000.exe"
          Start-Process $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Write-Host "安裝 / 啟動 / 解除安裝 正常"

      - name: Upload Setup.exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradingAdmin-Windows-Setup
          path: installer/TradingAdmin-Windows-Setup.exe
          if-no-files-found: error

      - name: Attach Setup.exe to Release (on tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/TradingAdmin-Windows-Setup.exe
          generate_release_notes: true
