name: Build & Release (macOS + Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-gui.txt pytest

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/admin_gui -q

      - name: Build .app + sign + .dmg + notarize
        env:
          # 未設定 → codesign_app.sh 退回 ad-hoc、notarize_dmg.sh 略過（建置仍成功）
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: bash scripts/build_gui.sh

      - name: Verify signature / Gatekeeper
        run: |
          codesign -dv --verbose=2 dist/TradingAdmin.app 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true
          spctl -a -t open --context context:primary-signature -v dist/TradingAdmin-macOS.dmg 2>&1 || echo "（未公證：Gatekeeper 不接受，首次需右鍵→開啟）"

      - name: Upload DMG as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradingAdmin-macOS
          path: dist/TradingAdmin-macOS.dmg
          if-no-files-found: error

      - name: Attach DMG to Release (on tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TradingAdmin-macOS.dmg
          generate_release_notes: true

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-gui.txt pytest

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: python -m pytest tests/admin_gui -q

      - name: Build TradingAdmin (onedir) + zip
        shell: pwsh
        run: |
          python -m PyInstaller admin_gui/admin_gui.spec --noconfirm --clean
          if (-not (Test-Path dist/TradingAdmin/TradingAdmin.exe)) { throw "TradingAdmin.exe not built" }
          Compress-Archive -Path dist/TradingAdmin -DestinationPath dist/TradingAdmin-Windows.zip -Force
          Get-Item dist/TradingAdmin-Windows.zip | Format-List Name,Length

      - name: Smoke test (exe starts, stays up 8s)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/TradingAdmin/TradingAdmin.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "TradingAdmin.exe exited early (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "exe 啟動正常"

      - name: Upload zip as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradingAdmin-Windows
          path: dist/TradingAdmin-Windows.zip
          if-no-files-found: error

      - name: Attach zip to Release (on tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TradingAdmin-Windows.zip
          generate_release_notes: true
